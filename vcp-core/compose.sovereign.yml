# Development-only: ICE deliberately bound to loopback; no exposed public certifier.
# vLLM is provisioned separately on an authorized GPU server.
services:
  ice:
    build:
      context: .
      dockerfile: Dockerfile.ice
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8796:8796"
    environment:
      ICE_OPERATOR_TOKEN: "${ICE_OPERATOR_TOKEN:?Operator token required}"
      ICE_ISSUER_PRIVATE_KEY_B64: "${ICE_ISSUER_PRIVATE_KEY_B64:?Issuer key required}"
      ICE_ISSUER_PUBLIC_KEY_B64: "${ICE_ISSUER_PUBLIC_KEY_B64:?Issuer public key required}"
      ICE_TRUSTED_WITNESS_KEYS_JSON: "${ICE_TRUSTED_WITNESS_KEYS_JSON:?Witness mapping required}"
      ICE_AUDIT_DB_PATH: /var/lib/ice/audit.db
    volumes:
      - ice_audit:/var/lib/ice
    networks: [certification]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8796/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - webui_data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WEBUI_AUTH: "True"
    networks: [inference]
networks:
  certification:
    internal: true
  inference: {}
volumes:
  ice_audit: {}
  webui_data: {}
