syntax = "proto3";
package inference.v1;
service MobileInferenceService {
  rpc StreamInference (InferenceRequest) returns (stream InferenceResponse);
  rpc VerifyStateAnchor (AnchorCheckRequest) returns (AnchorCheckResponse);
}
message InferenceRequest {
  string session_id = 1;
  string prompt = 2;
  float temperature = 3;
  int32 max_tokens = 4;
  bytes contextual_salt = 5;
  string model_id = 6;
}
message InferenceResponse {
  string token = 1;
  int32 token_index = 2;
  bool is_final = 3;
  bytes cryptographic_sig = 4;
  string receipt_hash = 5;
  string signing_key_id = 6;
  string backend = 7;
}
message AnchorCheckRequest {
  string session_id = 1;
  string absolute_state_hash = 2;
}
message AnchorCheckResponse {
  bool is_valid_continuity = 1;
  string im_receipt_id = 2;
  string verification_scope = 3;
}
