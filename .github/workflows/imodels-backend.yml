name: iModels backend tests
on:
  push:
    branches:
      - feature/buddy-receipts-backend-20261015
      - deploy/i-the-one-pwa-20261015
    paths:
      - 'i-api/**'
      - '.github/workflows/imodels-backend.yml'
  pull_request:
    paths:
      - 'i-api/**'
      - '.github/workflows/imodels-backend.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r i-api/requirements-dev.txt
      - run: python -m compileall -q i-api
      - run: cd i-api && python -m pytest -q tests
