name: iMobile iOS SwiftUI App
on:
  workflow_dispatch:
  push:
    branches: [feature/buddy-receipts-backend-20261015]
    paths: ['imobile-ios/**', '.github/workflows/imobile-ios-app.yml']
permissions:
  contents: read
jobs:
  ios-simulator-and-archive:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native Xcode project
        run: xcodegen generate --spec imobile-ios/project.yml --project imobile-ios
      - name: Build iOS simulator app unsigned
        run: |
          xcodebuild -project imobile-ios/iTheOne.xcodeproj -scheme iTheOne -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Archive real iOS device app unsigned
        run: |
          xcodebuild -project imobile-ios/iTheOne.xcodeproj -scheme iTheOne -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/iTheOne.xcarchive" CODE_SIGNING_ALLOWED=NO archive
          test -s "$RUNNER_TEMP/iTheOne.xcarchive/Products/Applications/iTheOne.app/iTheOne"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/iTheOne.xcarchive" "$RUNNER_TEMP/iTheOne-unsigned-archive.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: iTheOne-iOS-unsigned-archive
          path: ${{ runner.temp }}/iTheOne-unsigned-archive.zip
          if-no-files-found: error
          retention-days: 14
