name: iCrossPlane C++ 20k Node Acceptance
on:
  push:
    branches: [feature/buddy-receipts-backend-20261015]
    paths:
      - 'crossplane/**'
      - '.github/workflows/im-crossplane.yml'
  pull_request:
    paths:
      - 'crossplane/**'
      - '.github/workflows/im-crossplane.yml'
jobs:
  linux-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: C++17 compiler and CMake configure
        run: cmake -S crossplane -B /tmp/iscrossplane -DCMAKE_BUILD_TYPE=Release
      - name: Build shared i™ C++ core
        run: cmake --build /tmp/iscrossplane --parallel 2
      - name: Run synthetic 20k mixed-node test and SHA-256 vector
        run: ctest --test-dir /tmp/iscrossplane --output-on-failure
  apple-compiler:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile same C++ core with Apple Clang
        run: |
          cmake -S crossplane -B /tmp/iscrossplane-mac -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/iscrossplane-mac --parallel 2
          ctest --test-dir /tmp/iscrossplane-mac --output-on-failure
      - name: Compile portable Swift bridge module (macOS host only)
        run: swiftc -I crossplane/ios/ImCrossPlane -parse-as-library -emit-module -o /tmp/ImCrossPlane.swiftmodule crossplane/ios/ImCrossPlane.swift
      - name: Build real iOS arm64 static core
        run: |
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang++ -std=c++17 -arch arm64 -miphoneos-version-min=15.0 -isysroot "$sdk" -Icrossplane/include -c crossplane/src/im_crossplane.cpp -o /tmp/im_crossplane_ios.o
          xcrun libtool -static -o /tmp/libim_crossplane_ios_arm64.a /tmp/im_crossplane_ios.o
          test -s /tmp/libim_crossplane_ios_arm64.a
      - name: Compile Swift bridge for iOS device SDK
        run: |
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun swiftc -target arm64-apple-ios15.0 -sdk "$sdk" -I crossplane/ios/ImCrossPlane -parse-as-library -emit-module -o /tmp/ImCrossPlane-iOS.swiftmodule crossplane/ios/ImCrossPlane.swift
      - uses: actions/upload-artifact@v4
        with:
          name: iCrossPlane-iOS-ARM64-Static-Library
          path: |
            /tmp/libim_crossplane_ios_arm64.a
            /tmp/ImCrossPlane-iOS.swiftmodule
          if-no-files-found: error
          retention-days: 14
