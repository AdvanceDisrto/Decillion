name: Buddy Universal API Live Integration
on:
  push:
    branches: [feature/buddy-receipts-backend-20261015]
    paths: ['i-api/universal_router.py','i-api/main.py','i-api/test_universal_router.py','i-api/imirror.py','i-api/test_imirror.py','i-api/imodels.py','i-api/local_discovery.py','i-api/test_local_discovery.py','i-api/lifeline.py','i-api/test_lifeline.py','.github/workflows/iuniversalapi-live.yml']
  pull_request:
    paths: ['i-api/universal_router.py','i-api/main.py','i-api/test_universal_router.py']
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r i-api/requirements.txt
      - run: python -m compileall -q i-api
      - working-directory: i-api
        run: python -m unittest -v test_universal_router.py test_imirror.py test_local_discovery.py test_lifeline.py
