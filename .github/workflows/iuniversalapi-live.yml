name: Buddy Universal API Live Integration
on:
  workflow_dispatch:
  push:
    branches: [feature/buddy-receipts-backend-20261015]
    paths: ['i-api/sorcery.py','i-api/test_sorcery.py','i-api/ai_gateway.py','i-api/test_ai_gateway.py','i-api/universal_router.py','i-api/main.py','i-api/vcp_live.py','i-api/test_vcp_live.py','i-api/generative_seed.py','i-api/test_generative_seed.py','i-api/test_universal_router.py','i-api/imirror.py','i-api/test_imirror.py','i-api/imodels.py','i-api/local_discovery.py','i-api/test_local_discovery.py','i-api/lifeline.py','i-api/test_lifeline.py','i-api/telecom_orchestra.py','i-api/test_telecom_orchestra.py','i-api/imobile_telecom.py','i-api/test_imobile_telecom.py','i-api/imobile_live_signaling.py','i-api/test_imobile_live_signaling.py','i-api/imobile_crossband.py','i-api/test_imobile_crossband.py','i-api/dewi_mesh.py','i-api/test_dewi_mesh.py','i-api/crossplane_audit.py','i-api/test_crossplane_audit.py','i-api/vpu_lab.py','i-api/test_vpu_lab.py','i-api/vpu_grpc_benchmark.py','silicon/icalcula/**','edge/continuity/**','.github/workflows/iuniversalapi-live.yml']
  pull_request:
    paths: ['i-api/universal_router.py','i-api/main.py','i-api/test_universal_router.py']
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r i-api/requirements.txt
      - run: python -m compileall -q i-api
      - working-directory: i-api
        run: python -m unittest -v test_universal_router.py test_imirror.py test_local_discovery.py test_lifeline.py test_telecom_orchestra.py test_imobile_telecom.py test_imobile_crossband.py test_dewi_mesh.py test_vpu_lab.py test_crossplane_audit.py test_ai_gateway.py test_sorcery.py test_imobile_live_signaling.py test_vcp_live.py test_generative_seed.py

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build iMobile OCI image
        run: docker build -f i-api/Dockerfile.orchestra -t imobile:ci .
      - name: Launch authorized local container for tests
        run: docker run -d --name imobile-ci -p 127.0.0.1:18880:8080 imobile:ci
      - name: Verify real HTTP API and simulated offline routing
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          url='http://127.0.0.1:18880'
          for i in range(35):
              try:
                  r=json.load(urllib.request.urlopen(url+'/health', timeout=3))
                  if r.get('status')=='ok': break
              except Exception:time.sleep(1)
          else:raise RuntimeError('health never succeeded')
          body=json.dumps({'from_handle':'@sender','to_handle':'@buddy','total_nodes':12,'blackout_fraction':0.5}).encode()
          req=urllib.request.Request(url+'/v1/imobile/simulate',data=body,headers={'Content-Type':'application/json'})
          result=json.load(urllib.request.urlopen(req,timeout=5))
          assert result['nodes_offline']==6
          assert result['status']=='SIMULATED_NOT_TRANSMITTED'
          assert not result['receipt']['production_certified']
          print('IMOBILE CONTAINER HTTP PASS: real container, 50% simulated node outage, no carrier claims')
          PY
      - name: Inspect logs if build failed
        if: failure()
        run: docker logs imobile-ci || true

  silicon-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - name: Compile standalone decoder RTL
        run: iverilog -g2012 -Wall -s tb -o /tmp/icalcula_test silicon/icalcula/im_icalcula_decoder.v silicon/icalcula/tb_icalcula_decoder.v
      - name: Test HDL gates and injected faults
        run: vvp /tmp/icalcula_test

  continuity-go:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Compile and test Go offline queue
        working-directory: edge/continuity
        run: |
          go test -v ./...
          go build -o /tmp/i-continuity .

  grpc-ipc-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional gRPC runtime
        run: python -m pip install 'grpcio>=1.67,<1.81'
      - name: Benchmark authenticated-response digest over loopback gRPC
        working-directory: i-api
        run: python vpu_grpc_benchmark.py
