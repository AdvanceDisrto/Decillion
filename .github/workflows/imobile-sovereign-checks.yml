name: iMobile Sovereign API CI
on:
  workflow_dispatch:
  push:
    branches: [feature/buddy-receipts-backend-20261015]
    paths:
      - 'imobile-sovereign/**'
      - '.github/workflows/imobile-sovereign-checks.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore imobile-sovereign/Api/iMobile.Api.csproj
      - run: dotnet build imobile-sovereign/Api/iMobile.Api.csproj --configuration Release --no-restore
      - run: docker compose --env-file imobile-sovereign/.env.example -f imobile-sovereign/compose.yaml config --quiet
