name: i VCP deterministic verification CI
on:
  workflow_dispatch:
  push:
    branches: [feature/buddy-receipts-backend-20261015]
    paths:
      - 'vcp-core/**'
      - '.github/workflows/vcp-core-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=43,<47' 'fastapi>=0.115,<1'
      - run: cd vcp-core && python -m unittest -v
