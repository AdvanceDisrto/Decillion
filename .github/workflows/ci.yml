name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      IZETTA_VAULT_PASSPHRASE: github-actions-smoke-test-only
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest --cov=decillion --cov-report=term-missing --cov-fail-under=85
      - run: python scripts/smoke.py
      - run: python scripts/smoke_vault.py
      - run: python -m vault.cli smoke --vault "${RUNNER_TEMP}/vault-smoke"
      - run: python -m telepath.cli vault-smoke --workdir "${RUNNER_TEMP}/telepath-smoke"
      - run: python -m matrix.accelerator
      - run: python scripts/verify_repo.py
