name: iMobile Android Native APK
on:
  push:
    branches: [feature/buddy-receipts-backend-20261015]
    paths:
      - 'imobile-android/**'
      - '.github/workflows/imobile-android-apk.yml'
  pull_request:
    paths:
      - 'imobile-android/**'
      - '.github/workflows/imobile-android-apk.yml'
jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK, CMake and Android NDK
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build real arm64/x86_64 native-debug APK
        run: gradle -p imobile-android :app:assembleDebug --no-daemon --stacktrace
      - name: Inspect actual APK payload
        run: |
          test -s imobile-android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l imobile-android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/(arm64-v8a|x86_64)/libim_under_the_hood.so'
          sha256sum imobile-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: iMobile-Android-Debug-APK-unverified-hardware
          path: imobile-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
