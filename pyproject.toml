[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "decillion-storage"
version = "0.1.0"
description = "Zero-trust encrypted object storage and receipt aggregation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "cryptography>=43,<48",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
models = ["huggingface-hub>=0.27,<2"]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]

[project.scripts]
decillion = "decillion.cli:main"
decillion-models = "decillion.models:main"
decillion-vault = "vault.cli:main"
decillion-telepath = "telepath.cli:main"
decillion-accelerators = "matrix.accelerator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/decillion", "src/vault", "src/telepath", "src/matrix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP"]
ignore = ["S101"]
